name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/LfpMonitor-${{ github.run_number }}.apk

      - name: Сохранить APK в сборке
        uses: actions/upload-artifact@v4
        with:
          name: LfpMonitor-apk
          path: out/*.apk

      - name: Выложить APK в Releases (удобно скачивать с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LFP Монитор, сборка ${{ github.run_number }}
          files: out/*.apk
          make_latest: true
